<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .plan-circle { opacity: 0.8; }
      @keyframes grow {
        0%, 100% { transform: scaleY(0.6); }
        50% { transform: scaleY(1); }
      }
      .bar { animation: grow 2s ease-in-out infinite; transform-origin: bottom; }
    </style>
  </defs>

  <!-- Background circles -->
  <circle cx="150" cy="150" r="140" fill="#fee2e2" class="plan-circle"/>
  <circle cx="150" cy="150" r="120" fill="#eff6ff" class="plan-circle"/>
  <circle cx="150" cy="150" r="100" fill="#dcfce7" class="plan-circle"/>

  <!-- Growth chart illustration -->
  <g transform="translate(150, 110)">
    <!-- Grid background -->
    <line x1="-40" y1="40" x2="40" y2="40" stroke="#e5e7eb" stroke-width="1" opacity="0.5"/>
    <line x1="-40" y1="20" x2="40" y2="20" stroke="#e5e7eb" stroke-width="1" opacity="0.5"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#e5e7eb" stroke-width="1" opacity="0.5"/>

    <!-- Y-axis -->
    <line x1="-40" y1="-5" x2="-40" y2="45" stroke="#6b7280" stroke-width="2"/>
    <!-- X-axis -->
    <line x1="-40" y1="40" x2="45" y2="40" stroke="#6b7280" stroke-width="2"/>

    <!-- Growing bars -->
    <g class="bar" style="animation-delay: 0s;">
      <rect x="-30" y="20" width="12" height="20" fill="#16a34a" rx="2"/>
    </g>
    <g class="bar" style="animation-delay: 0.2s;">
      <rect x="-12" y="5" width="12" height="35" fill="#16a34a" rx="2"/>
    </g>
    <g class="bar" style="animation-delay: 0.4s;">
      <rect x="6" y="-10" width="12" height="50" fill="#16a34a" rx="2"/>
    </g>
    <g class="bar" style="animation-delay: 0.6s;">
      <rect x="24" y="-25" width="12" height="65" fill="#16a34a" rx="2"/>
    </g>

    <!-- Upward arrow -->
    <g opacity="0.6" transform="translate(35, -30)">
      <line x1="0" y1="15" x2="0" y2="-10" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="0,-10 -5,-2 5,-2" fill="#dc2626"/>
    </g>
  </g>

  <!-- Decorative elements -->
  <g opacity="0.5">
    <circle cx="60" cy="70" r="3" fill="#2563eb"/>
    <rect x="250" y="90" width="6" height="6" fill="#d97706" opacity="0.6"/>
    <polygon points="80,250 85,240 75,240" fill="#7c3aed" opacity="0.5"/>
  </g>

  <!-- Text -->
  <text x="150" y="210" font-size="16" font-weight="700" text-anchor="middle" fill="#111827">
    Build Your Growth Plan
  </text>
  <text x="150" y="235" font-size="12" text-anchor="middle" fill="#6b7280">
    Identify constraints, improve metrics,
  </text>
  <text x="150" y="253" font-size="12" text-anchor="middle" fill="#6b7280">
    plan your 90-day roadmap
  </text>
</svg>