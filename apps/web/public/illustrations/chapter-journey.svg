<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .chapter-node { transition: all 0.3s ease; }
      .chapter-node:hover circle { filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15)); }
      .chapter-node:hover text { font-weight: 700; }
      .gate-line { stroke: #e5e7eb; stroke-width: 2; }
      .gate-icon { opacity: 0.7; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="#fafafa" rx="12"/>

  <!-- Title -->
  <text x="600" y="30" font-size="24" font-weight="700" text-anchor="middle" fill="#111827">
    Your Transformation Journey
  </text>

  <!-- Connection lines -->
  <line x1="120" y1="140" x2="180" y2="140" class="gate-line" stroke-dasharray="2,4"/>
  <text x="150" y="125" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="600">Submit</text>

  <line x1="280" y1="140" x2="340" y2="140" class="gate-line" stroke-dasharray="2,4"/>
  <text x="310" y="125" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="600">Approve</text>

  <line x1="440" y1="140" x2="500" y2="140" class="gate-line" stroke-dasharray="2,4"/>
  <text x="470" y="125" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="600">Submit</text>

  <line x1="600" y1="140" x2="660" y2="140" class="gate-line" stroke-dasharray="2,4"/>
  <text x="630" y="125" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="600">Approve</text>

  <line x1="760" y1="140" x2="820" y2="140" class="gate-line" stroke-dasharray="2,4"/>
  <text x="790" y="125" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="600">Submit</text>

  <line x1="920" y1="140" x2="980" y2="140" class="gate-line" stroke-dasharray="2,4"/>
  <text x="950" y="125" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="600">Approve</text>

  <!-- START node -->
  <g class="chapter-node" data-chapter="start">
    <circle cx="60" cy="140" r="32" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="60" y="130" font-size="14" font-weight="700" text-anchor="middle" fill="#64748b">START</text>
    <text x="60" y="155" font-size="10" text-anchor="middle" fill="#475569">Readiness</text>
  </g>

  <!-- DEFINE (Chapter 1) node -->
  <g class="chapter-node" data-chapter="define">
    <circle cx="220" cy="140" r="32" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="220" y="128" font-size="12" font-weight="700" text-anchor="middle" fill="#2563eb">CHAPTER</text>
    <text x="220" y="142" font-size="12" font-weight="700" text-anchor="middle" fill="#2563eb">1</text>
    <text x="220" y="165" font-size="10" text-anchor="middle" fill="#1e40af">Define</text>
  </g>

  <!-- IMPLEMENT (Chapter 2) node -->
  <g class="chapter-node" data-chapter="implement">
    <circle cx="380" cy="140" r="32" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="380" y="128" font-size="12" font-weight="700" text-anchor="middle" fill="#16a34a">CHAPTER</text>
    <text x="380" y="142" font-size="12" font-weight="700" text-anchor="middle" fill="#16a34a">2</text>
    <text x="380" y="165" font-size="10" text-anchor="middle" fill="#15803d">Implement</text>
  </g>

  <!-- CONTROL (Chapter 3) node -->
  <g class="chapter-node" data-chapter="control">
    <circle cx="540" cy="140" r="32" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="540" y="128" font-size="12" font-weight="700" text-anchor="middle" fill="#d97706">CHAPTER</text>
    <text x="540" y="142" font-size="12" font-weight="700" text-anchor="middle" fill="#d97706">3</text>
    <text x="540" y="165" font-size="10" text-anchor="middle" fill="#b45309">Control</text>
  </g>

  <!-- IMPROVE (Chapter 4) node -->
  <g class="chapter-node" data-chapter="improve">
    <circle cx="700" cy="140" r="32" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="700" y="128" font-size="12" font-weight="700" text-anchor="middle" fill="#dc2626">CHAPTER</text>
    <text x="700" y="142" font-size="12" font-weight="700" text-anchor="middle" fill="#dc2626">4</text>
    <text x="700" y="165" font-size="10" text-anchor="middle" fill="#b91c1c">Improve</text>
  </g>

  <!-- FINISH (Chapter 5) node -->
  <g class="chapter-node" data-chapter="finish">
    <circle cx="860" cy="140" r="32" fill="#ecf8fa" stroke="#0891b2" stroke-width="3"/>
    <text x="860" y="128" font-size="12" font-weight="700" text-anchor="middle" fill="#0891b2">CHAPTER</text>
    <text x="860" y="142" font-size="12" font-weight="700" text-anchor="middle" fill="#0891b2">5</text>
    <text x="860" y="165" font-size="10" text-anchor="middle" fill="#0e7490">Finish</text>
  </g>

  <!-- Psychological progression arc (bottom) -->
  <g opacity="0.6">
    <text x="60" y="230" font-size="11" font-weight="600" text-anchor="middle" fill="#64748b">Uncertainty</text>
    <text x="220" y="230" font-size="11" font-weight="600" text-anchor="middle" fill="#2563eb">Clarity</text>
    <text x="380" y="230" font-size="11" font-weight="600" text-anchor="middle" fill="#16a34a">Confidence</text>
    <text x="540" y="230" font-size="11" font-weight="600" text-anchor="middle" fill="#d97706">Control</text>
    <text x="700" y="230" font-size="11" font-weight="600" text-anchor="middle" fill="#dc2626">Momentum</text>
    <text x="860" y="230" font-size="11" font-weight="600" text-anchor="middle" fill="#0891b2">Freedom</text>
  </g>

  <!-- Key outputs (top) -->
  <g opacity="0.5" font-size="9" fill="#475569">
    <text x="220" y="60" text-anchor="middle" font-weight="500">Blueprint</text>
    <text x="380" y="60" text-anchor="middle" font-weight="500">System</text>
    <text x="540" y="60" text-anchor="middle" font-weight="500">Dashboard</text>
    <text x="700" y="60" text-anchor="middle" font-weight="500">Growth Plan</text>
    <text x="860" y="60" text-anchor="middle" font-weight="500">Report</text>
  </g>

  <!-- Legend -->
  <g opacity="0.6" font-size="10" fill="#6b7280">
    <text x="1050" y="130" font-weight="600">Gates:</text>
    <line x1="1050" y1="145" x2="1090" y2="145" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="2,4"/>
    <text x="1105" y="150" font-size="9" fill="#6b7280">Coach approval</text>

    <circle cx="1065" cy="175" r="5" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="1095" y="180" font-size="9" fill="#6b7280">Active chapter</text>

    <circle cx="1065" cy="200" r="5" fill="none" stroke="#a5a5a5" stroke-width="2" opacity="0.5"/>
    <text x="1095" y="205" font-size="9" fill="#6b7280">Locked chapter</text>
  </g>
</svg>