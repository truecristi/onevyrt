<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .dashboard-card { transition: all 0.3s ease; }
      .dashboard-card:hover { filter: drop-shadow(0 4px 12px rgba(0,0,0,0.1)); }
      .card-icon { font-size: 32px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#fafafa" rx="12"/>

  <!-- Title -->
  <text x="300" y="35" font-size="22" font-weight="700" text-anchor="middle" fill="#111827">
    Your Business at a Glance
  </text>

  <!-- Card 1: Customer -->
  <g class="dashboard-card">
    <rect x="30" y="70" width="150" height="140" fill="white" stroke="#e5e7eb" stroke-width="1.5" rx="10"/>
    <!-- Blue accent -->
    <rect x="30" y="70" width="150" height="4" fill="#2563eb" rx="2"/>
    <!-- Icon -->
    <text x="105" y="115" text-anchor="middle" class="card-icon">👥</text>
    <!-- Label -->
    <text x="105" y="145" font-size="13" font-weight="700" text-anchor="middle" fill="#111827">Customer</text>
    <text x="105" y="163" font-size="11" text-anchor="middle" fill="#6b7280">Who you serve &amp;</text>
    <text x="105" y="177" font-size="11" text-anchor="middle" fill="#6b7280">what they want</text>
  </g>

  <!-- Card 2: Strategy -->
  <g class="dashboard-card">
    <rect x="225" y="70" width="150" height="140" fill="white" stroke="#e5e7eb" stroke-width="1.5" rx="10"/>
    <!-- Green accent -->
    <rect x="225" y="70" width="150" height="4" fill="#16a34a" rx="2"/>
    <!-- Icon -->
    <text x="300" y="115" text-anchor="middle" class="card-icon">🎯</text>
    <!-- Label -->
    <text x="300" y="145" font-size="13" font-weight="700" text-anchor="middle" fill="#111827">Strategy</text>
    <text x="300" y="163" font-size="11" text-anchor="middle" fill="#6b7280">Your offer &amp;</text>
    <text x="300" y="177" font-size="11" text-anchor="middle" fill="#6b7280">positioning</text>
  </g>

  <!-- Card 3: Numbers -->
  <g class="dashboard-card">
    <rect x="420" y="70" width="150" height="140" fill="white" stroke="#e5e7eb" stroke-width="1.5" rx="10"/>
    <!-- Orange accent -->
    <rect x="420" y="70" width="150" height="4" fill="#d97706" rx="2"/>
    <!-- Icon -->
    <text x="495" y="115" text-anchor="middle" class="card-icon">📊</text>
    <!-- Label -->
    <text x="495" y="145" font-size="13" font-weight="700" text-anchor="middle" fill="#111827">Numbers</text>
    <text x="495" y="163" font-size="11" text-anchor="middle" fill="#6b7280">Revenue, margins,</text>
    <text x="495" y="177" font-size="11" text-anchor="middle" fill="#6b7280">key metrics</text>
  </g>

  <!-- Bottom section: Plan -->
  <g class="dashboard-card">
    <rect x="127.5" y="240" width="345" height="130" fill="white" stroke="#e5e7eb" stroke-width="1.5" rx="10"/>
    <!-- Red accent -->
    <rect x="127.5" y="240" width="345" height="4" fill="#dc2626" rx="2"/>
    <!-- Icon -->
    <text x="300" y="285" text-anchor="middle" class="card-icon">📈</text>
    <!-- Label -->
    <text x="300" y="315" font-size="13" font-weight="700" text-anchor="middle" fill="#111827">Improvement Plan</text>
    <text x="300" y="333" font-size="11" text-anchor="middle" fill="#6b7280">Your next 90 days — bottleneck,</text>
    <text x="300" y="348" font-size="11" text-anchor="middle" fill="#6b7280">improvements &amp; impact</text>
  </g>

  <!-- Connecting lines to show flow -->
  <g opacity="0.3" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="3,3">
    <!-- Top to bottom connections -->
    <line x1="105" y1="210" x2="105" y2="240"/>
    <line x1="300" y1="210" x2="300" y2="240"/>
    <line x1="495" y1="210" x2="300" y2="240"/>
  </g>

  <!-- Footer note -->
  <text x="300" y="390" font-size="11" text-anchor="middle" fill="#6b7280" font-style="italic">
    Each card is a permanent artifact from your programme journey
  </text>
</svg>