version: 2
updates:
  # pnpm workspaces: a single root entry covers every workspace package's
  # package.json (Dependabot resolves the pnpm-workspace.yaml globs itself).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Security patches land as individual, easy-to-review PRs; routine
      # minor/patch bumps for everything else get grouped so they don't
      # flood the PR list the way 14 separate workspace packages would.
      routine-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
