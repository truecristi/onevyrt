name: CI

on:
  # Skip the (Postgres-backed, minutes-heavy) run for changes that can't affect
  # the build or tests — docs, deploy scripts, licence — so those never burn
  # Actions minutes. A commit that also touches real code still runs. This is
  # a trigger-level filter: the job never starts, so it costs zero minutes —
  # better than a step-level `if:` that still pays for checkout + install
  # before deciding to skip. See docs/CI_CD_OPTIMIZATION.md.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'deploy/**'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'deploy/**'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch: {}

# Only one CI run per ref at a time — a new push cancels the older run (both
# jobs below). deploy.yml keys off this workflow's overall conclusion, which
# is `success` only when every job here succeeds, so splitting into two jobs
# does not change deploy-gating safety.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, DB-free checks: audit, build, typecheck, lint. None of these touch
  # Postgres, so this job never pays for the service container. Runs in
  # parallel with `test` below rather than gating it — see
  # docs/CI_CD_OPTIMIZATION.md ("Finding 1") for the real numbers behind why
  # this split is worth ~1 minute today and a lot more once `test` itself
  # gets faster.
  checks:
    runs-on: ubuntu-latest
    # Was 10 (~20x the ~65s this job normally takes). Bumped for the audit
    # step's own retry budget below (up to ~7min worst case) — still a
    # backstop, not the expected duration.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Two-tier dependency audit:
      #  1. CRITICAL is a hard gate — a critical advisory must never ship, and
      #     there are none today, so this blocks a real regression without
      #     tripping on the known backlog.
      #  2. HIGH is advisory only — the current high advisories are transitive
      #     (mostly via next) and remediating them is a deliberate upgrade
      #     effort, so they report for visibility rather than blocking every
      #     unrelated PR. Promote the threshold to `high` once that backlog is
      #     cleared.
      #
      # The critical step retries itself (on top of pnpm's own 2 built-in
      # retries per attempt) — seen registry.npmjs.org/-/npm/v1/security/audits
      # time out (ERR_SOCKET_TIMEOUT) repeatedly across several unrelated PRs'
      # runs, each already-retried pnpm invocation still failing all 3 of its
      # own attempts. That's a registry-side/network issue, not a real
      # finding — a fresh shell-level attempt a few minutes later is a
      # legitimate chance at a transient outage clearing, not a lucky retry
      # papering over a real audit failure (a genuine critical advisory would
      # fail identically on every attempt, same as it does today).
      - name: Audit dependencies (critical — gating)
        id: audit-critical
        run: |
          for attempt in 1 2 3 4; do
            if pnpm audit --audit-level=critical; then
              exit 0
            fi
            echo "Attempt $attempt/4 failed."
            if [ "$attempt" -lt 4 ]; then
              echo "Retrying in 30s..."
              sleep 30
            fi
          done
          echo "All 4 attempts failed."
          exit 1
      - name: Audit dependencies (high — advisory)
        id: audit-high
        run: pnpm audit --audit-level=high || true
        continue-on-error: true

      - name: Build engine
        id: build-engine
        run: pnpm --filter @onevyrt/engine build

      - name: Engine tests
        id: engine-tests
        run: pnpm --filter @onevyrt/engine test

      # tsc resolves `@onevyrt/engine` to its built dist/ (see the package's
      # "types" field), so this needs Build engine to have already run.
      - name: Web typecheck
        id: typecheck
        run: pnpm --filter web typecheck

      # Lint gates on errors only (eslint exits non-zero on errors, zero on
      # warnings), matching the audit's "0 lint errors" target while the
      # remaining exhaustive-deps warnings are triaged in manageable groups.
      # No type-aware linting (no parserOptions.project — see
      # eslint.config.mjs), so this doesn't need the engine build at all; it
      # only runs after it here for a tidy step order.
      - name: Web lint
        id: lint
        run: pnpm --filter web lint

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Static checks"
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Dependency audit (critical, gating) | ${{ steps.audit-critical.outcome }} |"
            echo "| Dependency audit (high, advisory) | ${{ steps.audit-high.outcome }} |"
            echo "| Engine build | ${{ steps.build-engine.outcome }} |"
            echo "| Engine tests | ${{ steps.engine-tests.outcome }} |"
            echo "| Web typecheck | ${{ steps.typecheck.outcome }} |"
            echo "| Web lint | ${{ steps.lint.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    # That 28m25s/26m30s ceiling (docs/CI_CD_OPTIMIZATION.md "Finding 4")
    # is now stale — the suite has grown since. Two real, directly observed
    # runs this session: PR #254's run 33930173087 succeeded at 44m40s
    # (04:47:11-05:31:51Z); PR #255's run 33947618583 was cancelled at
    # exactly 45m16s (05:35:50-06:21:06Z), mid-e2e — the job-level ceiling
    # firing, not any step's own sub-timeout (checked: none of Web tests/
    # Production build/E2E's own timeouts below had individually elapsed).
    # 45min no longer has headroom; it's a coin flip. 70min restores real
    # margin over the actual ~45min total without approaching GitHub's
    # 360min default —
    # raising this costs nothing extra in billed minutes (billing is by
    # actual duration used, not the ceiling), it only stops a legitimate
    # in-progress run from being killed and forced to restart from scratch,
    # which is the far more expensive outcome. Finding 3's real fix
    # (de-serializing --test-concurrency=1) would shrink the actual runtime
    # instead of just widening the ceiling around it — still open, tracked
    # in docs/CI_CD_OPTIMIZATION.md, out of scope for this one-line fix.
    timeout-minutes: 70

    # An isolated Postgres spun up fresh for this run (audit §25: "Use an
    # isolated Postgres database in CI so database-backed tests actually run").
    # The migrations below build the whole schema on a vanilla postgres:16 —
    # there are no CREATE EXTENSION calls, so the stock image is sufficient — and
    # every DB-backed test is uid()-prefixed and self-cleaning, so a private
    # instance per run replaces the old shared-Supabase secret entirely.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: onevyrt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Points at the service container above. localhost/127.0.0.1 in the URL
      # tells lib/db to skip TLS (the service speaks plain Postgres).
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/onevyrt_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Duplicated from `checks` (~3s) so this job doesn't depend on it
      # finishing first — see docs/CI_CD_OPTIMIZATION.md for why that
      # tradeoff (a few seconds of repeated compute for true job parallelism)
      # is worth it here. Web tests and the production build both import
      # @onevyrt/engine, which resolves to this dist/ output.
      - name: Build engine
        id: build-engine
        run: pnpm --filter @onevyrt/engine build

      - name: Run migrations
        # Build the full schema on the fresh service DB before the tests that
        # query it. Idempotent (node-pg-migrate tracks applied migrations).
        id: migrate
        run: pnpm --filter web migrate:deploy

      - name: Web tests
        id: web-tests
        # Every Postgres-backed test needs DATABASE_URL (inherited from the job
        # env above). STRIPE_TEST_SECRET_KEY is optional: without it the billing
        # e2e test skips itself rather than failing — add it as a repo secret
        # (a Stripe test-mode key) to exercise that path in CI too.
        #
        # timeout-minutes below is a backstop, not the fix: this step is
        # ~25-28min on a *normal* run today (843 tests, --test-concurrency=1 —
        # see docs/CI_CD_OPTIMIZATION.md "Finding 3" for the real fix). 35min
        # only catches a run that's gone beyond even that unusually long but
        # normal range.
        timeout-minutes: 35
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          # A dedicated service DB has no external pooler cap, so give the
          # connection pool and the serial-drain timeout comfortable headroom
          # for the concurrency tests (which fan out ~40 same-row operations).
          DATABASE_POOL_MAX: "10"
          DATABASE_CONNECT_TIMEOUT_MS: "40000"
        run: pnpm --filter web test

      # Standard Next.js incremental-build cache. Speeds up the production
      # build below on a cache hit; harmless on a miss (falls back to the
      # lockfile-only restore key, then a clean build).
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.js', 'apps/web/**/*.jsx', 'apps/web/**/*.ts', 'apps/web/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      # Production build: everything above is cheaper to fail on, and the build
      # is the gate before a change could ship (audit §25 required sequence).
      # DATABASE_URL is present so any build-time data access resolves against
      # the migrated service DB.
      - name: Production build
        id: build
        timeout-minutes: 8
        run: pnpm --filter web build

      # Cache the downloaded browser binary keyed on the lockfile hash (which
      # pins the resolved Playwright version) — `playwright install` skips
      # re-downloading a binary already present here on a cache hit. The
      # --with-deps apt step still runs either way (fast: a no-op install
      # when the packages are already on the runner image).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Playwright flows + accessibility smoke — the last two steps of the audit's
      # required CI sequence. The e2e suite (e2e/*.spec.ts) covers the real
      # browser flows AND the axe a11y scan (e2e/axe.spec.ts). playwright.config
      # starts its own `next dev` webServer, which inherits DATABASE_URL from the
      # job env and points at the migrated service DB.
      - name: Install Playwright browser
        id: playwright-install
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: E2E flows + accessibility smoke (Playwright)
        id: e2e
        # Was 10 — a guess never actually validated end-to-end, since every
        # run of this PR's own CI history had died earlier in the suite
        # (build-time AUTH_SECRET, a Tailwind/Turbopack CSS parse crash, a
        # broken shared login helper hanging every test in three separate
        # spec files) before ever reaching a real measurement of the full
        # suite's true duration. 20 gives headroom to actually see the whole
        # suite's real pass/fail picture in one run instead of the step dying
        # partway through and hiding whatever comes after.
        timeout-minutes: 20
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          DATABASE_POOL_MAX: "10"
          DATABASE_CONNECT_TIMEOUT_MS: "40000"
          # The suite registers many accounts in one run; disable the per-IP
          # register/login throttle for this environment so it doesn't trip
          # partway through. The webServer (started by playwright.config) inherits
          # this env. Never set in production.
          RATE_LIMIT_DISABLED: "1"
        run: pnpm --filter web test:e2e

      - name: Upload Playwright traces on failure
        id: upload-traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Build + test (Postgres-backed)"
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Engine build | ${{ steps.build-engine.outcome }} |"
            echo "| Migrations | ${{ steps.migrate.outcome }} |"
            echo "| Web tests | ${{ steps.web-tests.outcome }} |"
            echo "| Production build | ${{ steps.build.outcome }} |"
            echo "| Playwright install | ${{ steps.playwright-install.outcome }} |"
            echo "| E2E + a11y | ${{ steps.e2e.outcome }} |"
            if [ "${{ steps.upload-traces.outcome }}" = "success" ]; then
              echo ""
              echo "Playwright traces uploaded — see this run's Artifacts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
